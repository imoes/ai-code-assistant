# CI für die VS-Code-Extension "AI Code Assistant".
#
# Die gebaute .vsix wird NICHT ins Repo committet, sondern als Job-Artefakt
# bereitgestellt: GitLab → Pipeline → Job "package" → "Download artifacts".
# Der Dateiname enthält die Version aus package.json, die laut AGENTS.md vor
# jeder Paketierung hochgezählt wird.

stages:
  - build
  - package
  - publish

default:
  # Der Runner wird über seinen Tag gewählt. Ohne Tag nimmt GitLab nur Runner,
  # die "run untagged jobs" erlauben – gibt es keinen solchen, bleibt der Job
  # hängen und die Pipeline schlägt fehl, ohne je ein Skript auszuführen.
  tags:
    - test-deploy
  image: node:22
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/

variables:
  # Reproduzierbare Installation aus package-lock.json
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"

# Ist "test-deploy" ein Shell-Runner, wird `image:` ignoriert und node muss auf
# dem Host liegen. Ohne diese Ausgabe endet der Job dann mit einem nackten
# "npm: command not found" irgendwo mitten im Protokoll.
.node_check: &node_check
  - echo "Runner $CI_RUNNER_DESCRIPTION (Tags $CI_RUNNER_TAGS)"
  - node --version || { echo "FEHLER node fehlt auf diesem Runner"; exit 1; }
  - npm --version

compile:
  stage: build
  before_script: *node_check
  script:
    - npm ci
    - npm run compile
    - npm run lint
    # Die Tests brauchen kein Netz und keinen Modellserver: sie fahren die
    # Engine gegen einen vscode-Stub und lokale Testserver.
    - npm test
  artifacts:
    # Kompilat an den package-Job weiterreichen, damit er nicht neu baut
    paths:
      - out/
    expire_in: 1 day

package:
  stage: package
  needs: [compile]
  before_script: *node_check
  script:
    - npm ci
    # npm run package setzt die --baseContentUrl/--baseImagesUrl für die
    # Selfhosted-GitLab-Instanz, die vsce nicht selbst erkennt.
    - npm run package
    - ls -la *.vsix
  artifacts:
    name: "ai-code-assistant-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    paths:
      - "*.vsix"
    expire_in: 30 days

# ── Immer dieselbe Adresse für den neuesten Build ───────────────────────────
#
# Ein Job-Artefakt liegt hinter der Pipeline, verlangt ein Login und läuft nach
# 30 Tagen ab. Wer die Extension installieren will, soll nicht erst die
# richtige Pipeline suchen müssen. Die Paketregistry hat einen festen Pfad:
#
#   $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/
#       ai-code-assistant/latest/ai-code-assistant.vsix
#
# Der Dateiname trägt bewusst KEINE Versionsnummer, sonst ändert sich die
# Adresse mit jeder Version. Die Version steht im Paketnamen "latest" nicht,
# aber im Manifest der .vsix und in der zusätzlich abgelegten Version.
#
# Zwei Ablagen, mit Absicht: "latest" wird bei jedem Lauf überschrieben,
# die Version daneben bleibt stehen. Ohne die zweite gäbe es keinen Weg
# zurück zu einem älteren Stand, sobald das Artefakt abgelaufen ist.
publish:
  stage: publish
  needs: [package]
  rules:
    # Nur der Hauptzweig. Ein Feature-Zweig, der "latest" überschreibt, wäre
    # eine stille Falle für jeden, der von dieser Adresse installiert.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script: *node_check
  script:
    # Ist "test-deploy" ein Shell-Runner, ist curl nicht gesetzt. Ohne diese
    # Zeile endet der Job mit einem nackten "curl: command not found".
    - curl --version > /dev/null || { echo "FEHLER curl fehlt auf diesem Runner"; exit 1; }
    - VERSION=$(node -p "require('./package.json').version")
    - VSIX=$(ls -1 *.vsix | head -1)
    - echo "Veroeffentliche $VSIX als Version $VERSION"
    - BASE="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ai-code-assistant"
    # Unter der Version - bleibt stehen
    - |
      curl --fail --silent --show-error --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "$VSIX" \
        "${BASE}/${VERSION}/ai-code-assistant.vsix"
    # Und unter "latest" - wird bei jedem Lauf überschrieben
    - |
      curl --fail --silent --show-error --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "$VSIX" \
        "${BASE}/latest/ai-code-assistant.vsix"
    - echo "Neuester Build:" "${BASE}/latest/ai-code-assistant.vsix"

# Ein Release-Eintrag macht eine Version in der Oberfläche sichtbar. Er hängt
# an einem Git-Tag – NICHT an "latest": ein Release auf einen festen Tag lässt
# sich nicht überschreiben, der Job wäre ab dem zweiten Lauf dauerhaft rot.
# Für "immer der neueste Build" ist die Paketregistry oben zuständig; hier
# geht es um benannte Stände, die stehen bleiben sollen.
#
#   git tag v0.11.9 && git push gitlab v0.11.9
release:
  stage: publish
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "Release fuer $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "$CI_COMMIT_TAG"
    description: "Gebaut aus $CI_COMMIT_SHORT_SHA."
    assets:
      links:
        - name: "ai-code-assistant.vsix (neuester Build)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ai-code-assistant/latest/ai-code-assistant.vsix"
